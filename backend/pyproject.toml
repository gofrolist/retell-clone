[project]
name = "arhiteq-api"
version = "0.1.0"
description = "Arhiteq control plane — Retell-compatible voice agent API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "redis>=8.1.0",
    "google-genai>=2.12.1",
    "livekit-api>=1.2.0",
    "prometheus-client>=0.26.0",
    "google-auth>=2.56.2,<2.57.0",
    "PyJWT>=2.8",
    "google-cloud-storage>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Upper bound is deliberate: ruff's *implicit* default rule set is part of
    # our lint contract (see [tool.ruff.lint]), and it expanded from ~2 rule
    # prefixes to ~38 in 0.16.0. Pinning the minor keeps that set from shifting
    # under us again without a reviewed bump.
    "ruff>=0.16.2,<0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

# `lint.select` is intentionally unset: we take ruff's default rule set as-is.
# It is a curated subset (only 3 of the ~60 `S` rules, 1 `D`, 2 `E`, …), so
# re-declaring it as prefixes would select far *more* than the default. The
# ruff pin in [dependency-groups] is what keeps the set stable.
[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default, which
# is exactly what B008 flags. These are evaluated by FastAPI per-request, not
# shared like a mutable default, so the rule does not apply.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "fastapi.Security",
]
