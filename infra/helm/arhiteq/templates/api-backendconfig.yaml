# The GCE load balancer's default backend timeout is 30s, which it applies to
# the whole response — including one that streams. Live Monitoring's SSE
# streams would be cut every 30 seconds, and while the dashboard reconnects,
# each cycle costs a fresh connect. The API caps its own streams (30 min), so
# this ceiling only has to sit above that.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "arhiteq.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # The literal default is load-bearing, not belt-and-braces: deploys run
  # `helm upgrade --reuse-values`, which re-renders the new chart against the
  # values already live in the cluster and does NOT merge in new defaults from
  # values.yaml. A freshly added key is therefore undefined at deploy time —
  # here that rendered `timeoutSec: null`, which the BackendConfig CRD rejects,
  # failing the release. Any new value this chart adds needs a default in the
  # template that uses it.
  timeoutSec: {{ .Values.api.backendTimeoutSec | default 2400 }}
