# Defaults for the in-repo livekit-sip chart. Production values live in
# ../livekit-sip-values.yaml (with a private, secret-filled copy).

replicaCount: 2

image:
  repository: livekit/sip
  tag: latest
  pullPolicy: IfNotPresent

# Rendered verbatim into the SIP_CONFIG_BODY secret (plus health/metrics
# ports below). See https://github.com/livekit/sip for the schema.
config:
  ws_url: ws://livekit-server.livekit.svc.cluster.local:443
  api_key: ""
  api_secret: ""
  redis:
    address: ""
  sip_port: 5060
  rtp_port:
    start: 10000
    end: 20000
  use_external_ip: true
  log_level: info

# hostNetwork: these bind on the node — keep them off common ports
# (8080/9090 are already taken by node agents).
healthPort: 8189
prometheusPort: 9889

# Scrape `prometheusPort` via a ClusterIP-only metrics Service (the signalling
# Service below is a public LoadBalancer and must not carry it).
serviceMonitor:
  create: true
  interval: 30s
  # The `to` label values worth storing, as literal hosts (the template quotes
  # each one for the regex, so `.` is a dot here, not a wildcard). Series with
  # any other `to` are dropped at ingest as scanner noise.
  #
  # `to` is the *host* from the INVITE's To-header, so it is whatever the far
  # side dialled — an IP as often as a name. Measured on prod 2026-08-20, the
  # live values were the LoadBalancer IP and the voice nodes' external IPs;
  # the `sip.<domain>` FQDN never appeared, because Telnyx resolves it before
  # it sends. So `service.loadBalancerIP` is appended to this list
  # automatically (see templates/servicemonitor.yaml) and does not need
  # repeating here; list only the extra hosts.
  #
  # The node external IPs are deliberately absent: those series are SIP
  # scanners reaching hostNetwork:5060 directly, which is exactly what this
  # filter is for. Real trunk traffic arrives via the LoadBalancer.
  #
  # Get this wrong and the metrics do not go to zero, they cease to exist —
  # `LiveKitSIPInboundSeriesMissing` is the backstop for that. To re-measure:
  #   kubectl port-forward -n livekit <sip-pod> 9889:9889
  #   curl -s localhost:9889/metrics | grep -oE 'to="[^"]*"' | sort -u
  knownSipHosts:
    - sip.telnyx.com # outbound trunk address (`dir="out"` series)

# RTP media flows directly to node IPs (matches the terraform firewall rule
# on the voice pool), so the pod runs with hostNetwork. Signalling (UDP
# 5060) additionally comes in via the LoadBalancer Service below.
service:
  type: LoadBalancer
  loadBalancerIP: ""
  annotations: {}

nodeSelector: {}
tolerations: []
resources: {}
