# Values for the official LiveKit server chart:
#   helm repo add livekit https://helm.livekit.io
#   helm install livekit-server livekit/livekit-server -n livekit -f livekit-server-values.yaml
#
# Strategy on GKE: hostNetwork-style port exposure for RTC media (UDP
# 50000-60000 straight on node IPs — matches the terraform firewall rule
# targeting the `voice-pool` node tag), plus a LoadBalancer Service for
# wss:// signalling pinned to the reserved static IP.

replicaCount: 2

livekit:
  port: 7880
  log_level: info

  rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    # Nodes advertise their external IPs for ICE.
    use_external_ip: true

  # Metrics port. The chart gates BOTH the container port and the
  # ServiceMonitor on this being set (`{{- if and .Values.serviceMonitor.create
  # .Values.livekit.prometheus_port }}`), so `serviceMonitor.create: true`
  # alone silently produces nothing — which is how livekit went unscraped from
  # the first install until 2026-08-20.
  prometheus_port: 6789

  # Multi-node routing requires Redis (Memorystore).
  # REDIS_HOST placeholder: terraform output `redis_host`.
  redis:
    address: REDIS_HOST:6379

  # API keys shared with arhiteq-api / worker / livekit-sip.
  # Generate once: `openssl rand -hex 16` (key) / `openssl rand -hex 32` (secret),
  # keep in sync with the arhiteq chart's LIVEKIT_API_KEY/SECRET.
  keys:
    APIArhiteqKey: "LIVEKIT_API_SECRET_CHANGE_ME"

  # TLS terminates at the LoadBalancer/Ingress layer or via turn/domain
  # config; for GKE the simplest is wss:// via the LB below + cert on a
  # proxy, or enable the chart's built-in turn+tls with a cert secret.

loadBalancer:
  # GKE external LB for signalling (wss://livekit.<domain>): NodePort +
  # GCE Ingress on the global static IP, TLS via a ManagedCertificate
  # (kubectl apply livekit-managed-cert.yaml — the chart only references it
  # by name). Ingress rules are generated from tls[].hosts.
  type: gke-managed-cert
  staticIpName: arhiteq-livekit-ip # global; terraform output `livekit_ip`
  certificateName: livekit-server-cert
  servicePort: 443
  tls:
    - hosts:
        - LIVEKIT_DOMAIN # livekit.<domain>
      # The chart renders spec.tls from this block; without a secretName the
      # GCE controller fails the whole LB sync (`secret "" does not exist`).
      # Point it at a self-signed placeholder — real TLS comes from the
      # ManagedCertificate above (SNI picks it for the livekit host):
      #   openssl req -x509 -newkey rsa:2048 -keyout k.pem -out c.pem \
      #     -days 3650 -nodes -subj "/CN=ingress-placeholder.invalid"
      #   kubectl -n livekit create secret tls livekit-ingress-placeholder-tls \
      #     --cert=c.pem --key=k.pem
      secretName: livekit-ingress-placeholder-tls

# Pin LiveKit to the voice node pool.
nodeSelector:
  workload: voice

tolerations:
  - key: dedicated
    operator: Equal
    value: voice
    effect: NoSchedule

# Requests are the scheduling floor, not the ceiling — the cluster autoscaler
# sizes the voice pool on requests alone, so oversized ones pin idle nodes.
# An SFU relays packets; it does not transcode, and measured idle draw is a
# couple of millicores. Keep requests near the real floor and let limits carry
# the burst headroom for concurrent calls.
resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "3"
    memory: 8Gi

# Prometheus metrics (scraped by kube-prometheus-stack).
# Needs `livekit.prometheus_port` set above; on its own this does nothing.
# The chart has no `labels` field — our Prometheus selects ServiceMonitors in
# every namespace regardless of release label (see the selector settings in
# monitoring/values.yaml), so no `release: monitoring` label is needed.
serviceMonitor:
  create: true
  interval: 30s
