# Values for kube-prometheus-stack
# (https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack)
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f values.yaml
#
# Dashboards: create the ConfigMap from ./dashboards first —
#   kubectl -n monitoring create configmap arhiteq-dashboards \
#     --from-file=dashboards/ \
#     --dry-run=client -o yaml | kubectl apply -f -

fullnameOverride: monitoring

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PodMonitors from any namespace and any
    # release label (arhiteq + livekit charts create their own).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    retention: 15d
    retentionSize: 45GB

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

grafana:
  # CHANGE ME (or better: set via --set-string grafana.adminPassword=... /
  # an existing secret with grafana.admin.existingSecret).
  #
  # Still required by the chart, but it is no longer a way in: the login form
  # and basic auth are both off below, so nothing accepts it. It stays because
  # the admin user still owns the provisioned dashboards, and because
  # re-enabling either switch is the recovery path when Google is what broke.
  adminPassword: CHANGE_ME_GRAFANA_ADMIN

  # The dashboard/datasource sidecars POST to Grafana's admin provisioning
  # API with the admin password — which `[auth.basic] enabled = false` now
  # refuses, turning every ConfigMap change into a 401 retry loop. Skipping
  # the reload costs nothing: both sidecars write files into a `type: file`
  # provider, and Grafana's provisioner rescans that directory on its own
  # (~10s). Only datasource *changes* lose their live path — those need a
  # pod restart now, which is a thing that happens roughly never.
  sidecar:
    dashboards:
      skipReload: true
    datasources:
      skipReload: true

  # Reachable at https://grafana.<domain> through its own GCE Ingress; see
  # the `ingress:` block below and extra/grafana-managed-cert.yaml.
  service:
    annotations:
      # Container-native load balancing. Without it the GCE controller wants
      # a NodePort Service and refuses a ClusterIP one.
      cloud.google.com/neg: '{"ingress": true}'

  ingress:
    enabled: true
    annotations:
      # Same as the arhiteq chart: GKE ships no IngressClass objects, so the
      # legacy annotation is the selector that works. spec.ingressClassName
      # pointing at a class that does not exist makes the controller ignore
      # the Ingress silently — no events, no LB.
      kubernetes.io/ingress.class: gce
      kubernetes.io/ingress.global-static-ip-name: arhiteq-grafana-ip
      kubernetes.io/ingress.allow-http: "false"
      networking.gke.io/managed-certificates: grafana-cert
    hosts:
      - CHANGE_ME_GRAFANA_HOST
    path: /
    pathType: Prefix

  # The ManagedCertificate the annotation above names. GKE does not create it
  # from the annotation: an Ingress referencing a certificate that does not
  # exist comes up serving the load balancer's own self-signed default, with
  # nothing but a cert warning to say why. Shipping it with the release also
  # means `helm uninstall` takes it away again.
  extraObjects:
    - apiVersion: networking.gke.io/v1
      kind: ManagedCertificate
      metadata:
        name: grafana-cert
      spec:
        domains:
          - CHANGE_ME_GRAFANA_HOST

  podAnnotations:
    # Rolls Grafana when the OAuth client changes. The id and secret arrive as
    # env vars from a Secret this chart does not own, so Helm sees nothing to
    # checksum: replacing the Secret on its own leaves the running process
    # holding the credentials it started with, and the only symptom is that
    # sign-in keeps failing against a client that looks correct in the cluster.
    arhiteq.com/oauth-client-checksum: CHANGE_ME_GRAFANA_OAUTH_CHECKSUM

  # The OAuth client id and secret are injected from the k8s Secret
  # `grafana-google-oauth` (gen-values.sh creates it from prod.env) rather
  # than written into this file: it is rendered into infra/private and passed
  # to Helm, so anything here also lands in `helm get values` and the release
  # Secret. GF_AUTH_GOOGLE_* override the matching grafana.ini keys.
  envValueFrom:
    GF_AUTH_GOOGLE_CLIENT_ID:
      secretKeyRef:
        name: grafana-google-oauth
        key: client-id
    GF_AUTH_GOOGLE_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-google-oauth
        key: client-secret

  grafana.ini:
    server:
      # Must be the public URL: Grafana builds the OAuth redirect_uri from it,
      # and a mismatch with the Google client's authorized redirect URI is a
      # redirect_uri_mismatch error at login, not a warning at boot.
      root_url: CHANGE_ME_GRAFANA_ROOT_URL

    auth:
      # Google is the only way in. Hiding the form is the visible half; the
      # half that matters is basic auth below, which is a separate switch —
      # leave it on and `curl -u admin:<password> https://<host>/api/...`
      # keeps working from the internet no matter what the login page shows.
      disable_login_form: true

    auth.basic:
      enabled: false

    auth.google:
      enabled: true
      # First login has to be able to create the Grafana user; the allowlist
      # below is what keeps that from meaning "anyone with a Google account".
      allow_sign_up: true
      # With the form gone the login page is one button, so auto_login would
      # only save a click — at the cost of making /login unreachable while
      # anything about the OAuth round trip is misbehaving.
      auto_login: false
      scopes: openid email profile
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      api_url: https://openidconnect.googleapis.com/v1/userinfo
      use_pkce: true

      # The allowlist. `allowed_domains`/`hosted_domain` are the usual filter,
      # but they only mean something for a Workspace domain — for @gmail.com
      # accounts they would admit the entire internet. So the filter is the
      # role mapping instead: an email that is not listed maps to no role, and
      # role_attribute_strict turns "no role" into a denied login rather than
      # a default Viewer account.
      role_attribute_path: CHANGE_ME_GRAFANA_ROLE_ATTRIBUTE_PATH
      role_attribute_strict: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: arhiteq
          orgId: 1
          folder: Arhiteq
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/arhiteq

  dashboardsConfigMaps:
    arhiteq: arhiteq-dashboards

  persistence:
    enabled: true
    size: 5Gi

alertmanager:
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Mounts every key of the named Secret at
    # /etc/alertmanager/secrets/<secret>/<key>. The bot token is read from
    # there via `bot_token_file` so it never enters this file, the Helm
    # release, or `helm get values` output. Create it out of band:
    #
    #   kubectl -n monitoring create secret generic alertmanager-telegram \
    #     --from-literal=bot-token='<BotFather token>'
    #
    # Rotating the token means replacing the Secret and deleting the
    # Alertmanager pod — the file is mounted, and Alertmanager re-reads
    # `bot_token_file` on every notification, but the kubelet can take a
    # minute to refresh the projected volume.
    secrets:
      - alertmanager-telegram

  # Replaces the chart's default config wholesale, so the pieces that are
  # only there by default — the "null" receiver, the Watchdog route, the
  # severity inhibit rules — have to be repeated here or they are lost.
  config:
    global:
      resolve_timeout: 5m

    route:
      # Not the chart default of `[namespace]` alone: that puts every
      # unrelated arhiteq alert in one message, so a webhook failure and a
      # latency regression arrive as one indistinguishable blob and share a
      # repeat interval.
      group_by: [alertname, namespace, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: telegram

      routes:
        # Always-firing heartbeat from the chart. It exists to prove the
        # alerting path works end to end, which is only useful to something
        # watching Alertmanager from outside; sending it to Telegram would
        # mean a message every repeat interval, forever.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"

        # Nothing else routes InfoInhibitor anywhere; without this it would
        # fall through to the default receiver and get sent.
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"

        - receiver: telegram-critical
          matchers:
            - severity = "critical"
          # A page-worthy alert should not wait out a 5m group interval, and
          # should keep nagging until someone acts on it.
          group_wait: 10s
          group_interval: 2m
          repeat_interval: 1h

    # Chart defaults, kept verbatim: a critical alert suppresses the warning
    # and info alerts that share its name and namespace, so one broken thing
    # sends one message rather than three.
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = "warning"]
        target_matchers: [severity = "info"]
        equal: [namespace, alertname]
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]
      - target_matchers: [alertname = "InfoInhibitor"]

    # Dropped along with the rest of the chart's default config when `config`
    # was overridden, and `templateFiles` below is inert without it — the
    # chart mounts those files here.
    templates:
      - /etc/alertmanager/config/*.tmpl

    receivers:
      - name: "null"

      - name: telegram
        telegram_configs: &telegram
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            # Placeholder, substituted by gen-values.sh from prod.env. The
            # real id lives only in the gitignored private values file: this
            # repo is public and a chat id names a real person's chat.
            # Negative for groups and channels, positive for a direct chat.
            chat_id: TELEGRAM_CHAT_ID
            parse_mode: HTML
            send_resolved: true
            message: '{{ template "telegram.arhiteq.message" . }}'

      # Same destination, different routing timings (see the route above).
      - name: telegram-critical
        telegram_configs: *telegram

  # Alertmanager renders the Telegram `message` with html/template, which
  # escapes whatever an action interpolates but leaves the template's own
  # literal markup alone. So `<b>` below is real markup, and a `<` inside an
  # annotation arrives as `&lt;` without anything here doing the work.
  #
  # Escaping it by hand first — which is the obvious defensive move — is what
  # you must NOT do: html/template then escapes the escape, and Telegram
  # renders the literal text `a &lt; b` instead of `a < b`.
  #
  # The 8-alert cap keeps a large group under Telegram's 4096-character
  # message limit; over it, the send fails and the notification is lost.
  #
  # The overflow line prints the group total, not the remainder: Alertmanager
  # renders this with Go text/template, which has no arithmetic and no sprig,
  # so `sub` is not available to compute `len - 8`. An unknown function is a
  # render error, and a render error means the notification is never sent —
  # so the wording says "8 of N", never "+N more".
  templateFiles:
    arhiteq.tmpl: |-
      {{ define "telegram.arhiteq.message" -}}
      {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}🚨{{ else }}⚠️{{ end }} <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} · {{ .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ×{{ len .Alerts }}{{ end }}
      {{ range $i, $a := .Alerts }}{{ if lt $i 8 }}
      <b>{{ $a.Annotations.summary }}</b>
      {{ if $a.Annotations.description }}{{ $a.Annotations.description }}
      {{ end }}{{ if $a.Labels.pod }}<code>{{ $a.Labels.pod }}</code>
      {{ end }}{{ end }}{{ end }}
      {{- if gt (len .Alerts) 8 }}
      <i>{{ len .Alerts }} alerts in this group, first 8 shown</i>
      {{ end }}
      {{- end }}

# Trim node-level components' resource footprint.
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Node exporter must also run on tainted voice nodes.
  tolerations:
    - key: dedicated
      operator: Equal
      value: voice
      effect: NoSchedule

# GKE manages the control plane; these scrapes always fail there.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
# GKE runs kube-dns, not CoreDNS. The chart's CoreDNS ServiceMonitor still
# matches kube-dns's Service labels, so it discovers the pods and then fails
# on :9153, which kube-dns does not serve — two permanently-down targets that
# make "any target down?" useless as a health question.
coreDns:
  enabled: false
