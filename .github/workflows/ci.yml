name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Without this a hung test sits on the runner for GitHub's 6h default
    # before anyone finds out (seen on #158).
    timeout-minutes: 15
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { python-version: "3.14" }
      - run: uv sync --locked
      - name: Contract + unit tests (with coverage gate)
        run: uv run --no-sync python -m pytest tests/ -q --cov=arhiteq_api --cov-report=term-missing --cov-fail-under=80
      - name: Lint
        run: uv run --no-sync ruff check src tests

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { python-version: "3.14" }
      # dev group only: tests don't need the livekit-agents runtime stack
      - run: uv sync --locked --only-group dev
      - name: Tests (contract-critical modules gated)
        run: uv run --no-sync python -m pytest tests/ -q --cov=. --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm lint
        run: helm lint infra/helm/arhiteq
